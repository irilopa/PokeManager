name: README sync

on:
  pull_request:
    paths:
      - README.md
      - README.en.md
      - .github/scripts/check_readme_sync.py
  push:
    branches: [master]
    paths:
      - README.md
      - README.en.md

permissions:
  contents: read

jobs:
  check:
    name: Versiones del README sincronizadas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar estructura y cambios en ambas versiones
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python .github/scripts/check_readme_sync.py --base "origin/${{ github.base_ref }}"
          else
            python .github/scripts/check_readme_sync.py
          fi
