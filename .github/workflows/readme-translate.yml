name: README translate

# Cuando cambia README.md en master, Claude traduce los cambios a README.en.md
# y abre un pull request para revisarlos. Requiere el secreto ANTHROPIC_API_KEY
# y, en Settings → Actions → General, permitir que GitHub Actions cree pull requests.

on:
  push:
    branches: [master]
    paths:
      - README.md
  workflow_dispatch:

concurrency:
  group: readme-translate
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    name: Traducir README al inglés
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Comprobar la clave de la API
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Falta el secreto ANTHROPIC_API_KEY; no se traduce el README."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SDK de Anthropic
        if: steps.key.outputs.present == 'true'
        run: pip install "anthropic>=2.13,<3"

      - name: Traducir con Claude
        if: steps.key.outputs.present == 'true'
        run: python .github/scripts/translate_readme.py

      - name: Validar la estructura de las dos versiones
        if: steps.key.outputs.present == 'true'
        run: python .github/scripts/check_readme_sync.py

      - name: Abrir pull request con la traducción
        if: steps.key.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/readme-en
          delete-branch: true
          add-paths: README.en.md
          commit-message: "docs: actualizar README.en.md con la traducción de README.md"
          title: "docs: traducción automática de README.md al inglés"
          body: |
            `README.md` ha cambiado en `master` y Claude ha actualizado `README.en.md`.

            - Revisa el diff antes de fusionar: la traducción reutiliza las frases ya existentes y solo debería cambiar lo que cambió en español.
            - La estructura de las dos versiones ya se ha validado con `check_readme_sync.py`.

            Generado por el workflow «README translate».
