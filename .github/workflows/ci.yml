name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Node.js (Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Tests unitarios y E2E contra Firebase Emulator Suite
        run: >
          firebase emulators:exec --only auth,firestore --project pokemanager-6113d
          "./gradlew testDebugUnitTest"

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Capturas E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: |
            app/build/e2e-screenshots/
            app/build/readme-screenshots/
          if-no-files-found: ignore

      - name: APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: pokemanager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
