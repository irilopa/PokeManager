name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Node.js (Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Tests unitarios y E2E contra Firebase Emulator Suite
        run: >
          firebase emulators:exec --only auth,firestore --project pokemanager-6113d
          "./gradlew testDebugUnitTest"

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Capturas E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: |
            app/build/e2e-screenshots/
            app/build/readme-screenshots/
          if-no-files-found: ignore

      - name: APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: pokemanager-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build de publicación (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clave de firma (si está configurada)
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin secretos de firma: se compila con la clave de depuración solo para comprobar R8."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK y AAB de publicación
        env:
          CRASHLYTICS_UPLOAD_MAPPING: ${{ steps.signing.outputs.signed == 'true' && github.event_name == 'push' }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=1.${{ github.run_number }}

      - name: APK de publicación (para probar en un móvil)
        uses: actions/upload-artifact@v4
        with:
          name: pokemanager-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: AAB firmado para Google Play
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pokemanager-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Mapping de R8
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

